# Dados do autor e redes sociais
author: "Thiago Medeiros"
email: "thiago.wav1@gmail.com"
github_username: "thiagomedeiros11"
linkedin_url: "https://www.linkedin.com/in/thiagomedeiros11/"

# O repositório chama "newhorizons.github.io", então o GitHub Pages
